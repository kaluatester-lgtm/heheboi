<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Heheboi</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body{
    font-family:'Poppins',sans-serif;
    margin:0;
    padding:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color:#fff;
  }
  .card{
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    border-radius:20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    max-width:400px;
    width:90%;
    text-align:center;
    padding:30px 20px;
  }
  h1{
    font-size:20px;
    font-weight:600;
    margin-bottom:12px;
    color:#00f0ff;
    text-shadow: 1px 1px 5px #0ff;
  }
  input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    margin:10px 0;
    font-size:16px;
    outline:none;
  }
  button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background: linear-gradient(90deg,#00d4ff,#00ffab);
    color:#05192a;
    font-weight:700;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
  }
  button:hover{
    transform: scale(1.05);
  }
  .error{
    color:#ff6b6b;
    margin-top:8px;
    font-size:14px;
  }
  #secret{
    display:none;
    margin-top:20px;
    animation: fadeIn 1s ease forwards;
  }
  @keyframes fadeIn{
    0%{opacity:0; transform: translateY(-10px);}
    100%{opacity:1; transform: translateY(0);}
  }
  img{
    width:100%;
    border-radius:15px;
    margin-top:15px;
    border:5px solid rgba(255,255,255,0.1);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .secret-text{
    margin-top:10px;
    font-size:18px;
    font-weight:700;
    color:#00ffae;
    text-shadow: 1px 1px 4px #00d4ff;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Password daalo dost, aapse ek baat puchni hai</h1>

    <input id="pw" type="password" placeholder="Enter password" autocomplete="off" />
    <button id="open">Open</button>
    <div id="msg" class="error"></div>

    <div id="secret">
      <img id="pic" src="funny_face.jpg" alt="private image" />
      <div class="secret-text">Maa kaisi hai Teri?</div>
    </div>
  </div>

<script>
  const PASSWORD = 'bhootkimaakichut';
  const pwInput = document.getElementById('pw');
  const msg = document.getElementById('msg');
  const secret = document.getElementById('secret');
  const btn = document.getElementById('open');

  btn.addEventListener('click', () => {
    if(!pwInput.value){
      msg.textContent = 'Password daal bhai';
      return;
    }
    if(pwInput.value === PASSWORD){
      secret.style.display = 'block';
      msg.textContent = '';
      pwInput.style.display='none';
      btn.style.display='none';
    } else {
      msg.textContent = 'Wrong password';
    }
  });
</script>
</body>
</html>
