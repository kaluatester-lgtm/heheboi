<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Heheboi — Private</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{font-family:Inter,Arial,Helvetica,sans-serif;background:linear-gradient(120deg,#0f172a,#0b3b61);min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;color:#fff}
  .card{background:rgba(255,255,255,0.04);padding:28px;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,0.5);max-width:720px;width:95%;text-align:center}
  h1{margin:0 0 8px;font-size:22px}
  p{margin:6px 0 14px;opacity:0.9}
  input{width:100%;padding:12px;border-radius:8px;border:0;font-size:16px;margin-top:8px}
  button{margin-top:12px;padding:10px 16px;border-radius:8px;border:0;background:#00d4ff;color:#05192a;font-weight:700;cursor:pointer}
  .error{color:#ff9aa2;margin-top:10px}
  #secret{display:none;margin-top:18px}
  img{max-width:100%;border-radius:12px;margin-top:10px;border:6px solid rgba(255,255,255,0.03);box-shadow:0 8px 30px rgba(0,0,0,0.6)}
  .small{font-size:12px;opacity:0.8;margin-top:8px}
</style>
</head>
<body>
  <div class="card">
    <h1>Heheboi — Crew Access</h1>
    <p class="small">Enter the password your crew has. Don’t share the link publicly.</p>

    <input id="pw" type="password" placeholder="Password" autocomplete="off" />
    <button id="open">Open</button>
    <div id="msg" class="error"></div>

    <div id="secret">
      <h3 style="margin-top:6px">Tada 😜</h3>
      <!-- Make sure funny_face.jpg is in the same folder as this index.html -->
      <img id="pic" src="funny_face.jpg" alt="protected image" />
      <p class="small">If you see this, you're in. Don't screenshot if it's private.</p>
    </div>
  </div>

<script>
// Password: bhootkimaakichut
// Stored SHA-256 hash of that password:
const STORED_HASH = '3ee2482ea6c8fad1b9c4f3bdb71b799656734e9a4ceb1e6eab21cd71680d0137';

// compute SHA-256 hex using Web Crypto
async function sha256Hex(str) {
  const enc = new TextEncoder();
  const data = enc.encode(str);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2,'0')).join('');
}

document.getElementById('open').addEventListener('click', async () => {
  const pw = document.getElementById('pw').value || '';
  if (pw.length < 1) {
    document.getElementById('msg').textContent = 'Enter the password';
    return;
  }
  document.getElementById('msg').textContent = 'Checking...';
  try {
    const h = await sha256Hex(pw);
    if (h === STORED_HASH) {
      document.getElementById('secret').style.display = 'block';
      document.getElementById('msg').textContent = '';
      // optionally hide input
      document.getElementById('pw').style.display = 'none';
      document.getElementById('open').style.display = 'none';
    } else {
      document.getElementById('msg').textContent = 'Wrong password';
    }
  } catch (e) {
    document.getElementById('msg').textContent = 'Error. Use a modern browser.';
  }
});
</script>
</body>
</html>
