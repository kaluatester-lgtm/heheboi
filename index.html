<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Heheboi</title>
  <style>
    body {
      margin: 0;
      font-family: "Montserrat", sans-serif;
      background: linear-gradient(135deg, #ffdee9, #b5fffc);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 15px;
    }

    .password-container {
      position: relative;
      width: 250px;
      margin: auto;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 10px;
      padding-right: 40px; /* jagah eye ke liye */
      font-size: 16px;
      border: 2px solid #333;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .toggle-eye {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 20px;
      user-select: none;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #ff4b5c;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #e63946;
    }

    #secret {
      display: none;
      margin-top: 20px;
      animation: fadeIn 1s ease forwards;
    }

    #secret h2 {
      font-size: 28px;
      background: linear-gradient(to right, red, black);
      -webkit-background-clip: text;
      color: transparent;
      font-weight: bold;
      margin-bottom: 15px;
    }

    #secret img {
      width: 280px;
      max-width: 90vw;
      border-radius: 12px;
      box-shadow: 0px 0px 20px rgba(0,0,0,0.3);
      animation: popIn 0.7s ease forwards;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    @keyframes popIn {
      from {transform: scale(0.5); opacity: 0;}
      to {transform: scale(1); opacity: 1;}
    }

    /* Blast animation canvas */
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h1>Password daalo dost, ek baat puchni hai</h1>
  
  <div class="password-container">
    <input type="password" id="password" placeholder="Enter password">
    <span class="toggle-eye" onclick="togglePassword()">👁️</span>
  </div>
  
  <button onclick="checkPassword()">Click Password</button>
  
  <div id="secret">
    <h2>Maa Kaisi hai Teri?</h2>
    <img src="funny_face.jpg" alt="Secret Image"/>
  </div>
  
  <canvas id="blast"></canvas>
  
  <script>
    function togglePassword() {
      const passwordField = document.getElementById("password");
      const eyeIcon = document.querySelector(".toggle-eye");

      if (passwordField.type === "password") {
        passwordField.type = "text";
        eyeIcon.textContent = "🙈"; // band
      } else {
        passwordField.type = "password";
        eyeIcon.textContent = "👁️"; // khula
      }
    }

    function checkPassword() {
      const input = document.getElementById("password").value;
      if (input === "bhootkimaakichut") {
        document.querySelector("h1").style.display = "none";
        document.querySelector(".password-container").style.display = "none";
        document.querySelector("button").style.display = "none";
        document.getElementById("secret").style.display = "block";
        blastEffect();
      } else {
        alert("Galat password!");
      }
    }

    // Cartoon blast effect
    function blastEffect() {
      const canvas = document.getElementById("blast");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      for (let i = 0; i < 50; i++) {
        particles.push({
          x: canvas.width/2,
          y: canvas.height/2,
          dx: (Math.random() - 0.5) * 6,
          dy: (Math.random() - 0.5) * 6,
          size: Math.random() * 6 + 4,
          color: `hsl(${Math.random()*360},100%,50%)`,
          life: 80
        });
      }

      function animate() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        particles.forEach((p, i) => {
          p.x += p.dx;
          p.y += p.dy;
          p.life--;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          ctx.fillStyle = p.color;
          ctx.fill();
          if (p.life <= 0) particles.splice(i,1);
        });
        if (particles.length > 0) requestAnimationFrame(animate);
      }
      animate();
    }
  </script>
</body>
</html>
