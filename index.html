<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heheboi Anime Style</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
body, html{
  margin:0; padding:0; height:100%;
  font-family: 'Montserrat', sans-serif;
  background: linear-gradient(135deg, #ffe6f0, #fff8e6);
  display:flex; align-items:center; justify-content:center;
}
.card{
  background: #ffffffcc;
  padding:30px;
  border-radius:20px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.12);
  width:90%; max-width:720px;
  text-align:center;
  position: relative;
  overflow:hidden;
}
.prompt{
  font-size:16px;
  color:#555;
  margin-top:10px;
}
.controls{
  margin-top:20px;
  display:flex; justify-content:center; gap:12px; flex-wrap:wrap;
  align-items:center;
}
.pw-wrap{
  position:relative;
  flex:1;
  min-width:160px;
}
.controls input{
  width:100%;
  padding:12px 36px 12px 16px; /* right space for small eye */
  border-radius:12px;
  border:2px solid #ff91a4;
  font-size:15px;
  outline:none;
  box-sizing:border-box;
  background:#fff;
}
.eye-btn{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  width:24px;   /* chhota */
  height:24px;  /* chhota */
  border:none;
  background:transparent; /* no gradient, no box-shadow */
  padding:0;
  cursor:pointer;
}
.eye-btn svg{ 
  width:18px; 
  height:18px; 
  display:block; 
}
  .controls input{
  width:100%;
  padding:12px 36px 12px 16px; /* right side chhota space */
  border-radius:12px;
  border:2px solid #ff91a4;
  font-size:15px;
  outline:none;
  box-sizing:border-box;
  background:#fff;
}
.controls button{
  padding:12px 18px;
  border:none;
  border-radius:12px;
  background: linear-gradient(90deg,#ff91a4,#ff6f91);
  color:#fff; font-weight:700;
  cursor:pointer;
  transition: transform 0.12s ease;
}
.controls button:active{ transform: translateY(1px); }
.msg{ color:#ff6f91; font-size:13px; margin-top:10px; height:18px; }
.secret{
  display:none;
  margin-top:25px;
}
.secret-title{
  font-family:'Baloo 2', cursive;
  font-size:30px;
  font-weight:700;
  color:#ff6f91;
  margin-bottom:12px;
  opacity:0;
  transform: translateY(-10px);
  transition: all .6s ease-out;
}
.image-wrap{
  border-radius:16px;
  overflow:hidden;
  border:4px solid #ffc0cb55;
  box-shadow:0 15px 40px rgba(0,0,0,0.08);
  background:#fff3e6;
}
.image-wrap img{
  width:100%;
  opacity:0;
  transform: scale(.95);
  transition: all .8s cubic-bezier(.2,.9,.2,1);
}
.revealed .secret-title{ opacity:1; transform: translateY(0) scale(1); }
.revealed .image-wrap img{ opacity:1; transform: scale(1); }
.sparkle{
  position:absolute; width:8px; height:8px; border-radius:50%;
  background: radial-gradient(circle,#ffd3f0,#ff91a4);
  box-shadow:0 6px 15px rgba(255,145,150,0.2);
  opacity:0; pointer-events:none; transform: translateY(0) scale(.6);
}
@media (max-width:520px){
  .controls{ flex-direction:column; gap:10px; }
  .pw-wrap{ width:100%; }
  .controls button{ width:100%; }
}
</style>
</head>
<body>
  <div class="card" id="wrap">
    <div id="preReveal">
      <div class="prompt">Password daalo dost, ek baat puchni hai</div>
      <div class="controls" id="controls">
        <div class="pw-wrap">
          <input id="pw" type="password" placeholder="Enter password" aria-label="Password">
          <button id="eyeBtn" class="eye-btn" aria-label="Show password" title="Show / hide password">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"></svg>
          </button>
        </div>
        <button id="openBtn">Click Password</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>

    <div class="secret" id="secret">
      <div class="secret-title" id="secretTitle">Maa Kaisi hai Teri?</div>
      <div class="image-wrap">
        <img id="pic" src="funny_face.jpg" alt="private image">
      </div>
    </div>
  </div>

<script>
const PASSWORD='bhootkimaakichut';
const pw=document.getElementById('pw');
const btn=document.getElementById('openBtn');
const msg=document.getElementById('msg');
const wrap=document.getElementById('wrap');
const secret=document.getElementById('secret');
const preReveal=document.getElementById('preReveal');
const eyeBtn=document.getElementById('eyeBtn');
const eyeIcon=document.getElementById('eyeIcon');

let eyeVisible=false;

const EYE_OPEN = `
  <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" stroke="#7a2a3a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="12" cy="12" r="3" fill="#7a2a3a"/>
`;
const EYE_SLASH = `
  <path d="M3 3l18 18" stroke="#7a2a3a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M10.58 10.58A3 3 0 0 0 13.42 13.42" stroke="#7a2a3a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M2 12s4-7 10-7c2.04 0 3.92.48 5.5 1.32" stroke="#7a2a3a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M21.47 16.11A15.95 15.95 0 0 0 22 12s-4 7-10 7a10.94 10.94 0 0 1-4.5-.9" stroke="#7a2a3a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
`;
eyeIcon.innerHTML=EYE_SLASH;

eyeBtn.addEventListener('click',(e)=>{
  e.preventDefault();
  eyeVisible=!eyeVisible;
  if(eyeVisible){
    pw.type='text';
    eyeIcon.innerHTML=EYE_OPEN;
  }else{
    pw.type='password';
    eyeIcon.innerHTML=EYE_SLASH;
  }
});

btn.addEventListener('click', tryOpen);
pw.addEventListener('keydown', e=>{ if(e.key==='Enter') tryOpen(); });

function tryOpen(){
  msg.textContent='';
  const v=pw.value||'';
  if(!v){ msg.textContent='Password daal bhai'; return; }
  if(v!==PASSWORD){ msg.textContent='Wrong password'; pw.value=''; shakeControls(); return; }
  showBlast();
  preReveal.style.display='none';
  secret.style.display='block';
  setTimeout(()=>wrap.classList.add('revealed'),40);
}
function shakeControls(){
  const controls=document.getElementById('controls');
  controls.animate([
    { transform:'translateX(0)' },
    { transform:'translateX(-6px)' },
    { transform:'translateX(6px)' },
    { transform:'translateX(0)' }
  ], { duration:260, easing:'ease' });
}
function showBlast(){
  const count=20;
  for(let i=0;i<count;i++){
    const s=document.createElement('div');
    s.className='sparkle';
    s.style.left=(10+Math.random()*80)+'%';
    s.style.top=(10+Math.random()*40)+'%';
    document.body.appendChild(s);
    s.animate([
      { opacity:0, transform:'translateY(6px) scale(.6)' },
      { opacity:1, transform:'translateY(-15px) scale(1.2)' },
      { opacity:0, transform:'translateY(-35px) scale(.4)' }
    ], { duration:800+Math.random()*400, easing:'cubic-bezier(.2,.9,.2,1)' });
    setTimeout(()=>s.remove(),1400);
  }
}
</script>
</body>
</html>
