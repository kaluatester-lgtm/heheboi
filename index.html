<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Heheboi</title>

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg1: #0f0c29;
    --bg2: #302b63;
    --card: rgba(255,255,255,0.04);
    --accent1: #ff7a00;
    --accent2: #ff001f;
    --green: #00ffae;
  }

  /* Base layout */
  html,body{height:100%;margin:0}
  body{
    font-family:'Poppins',system-ui,Arial; 
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(135deg,var(--bg1),var(--bg2));
    transition: background 0.8s ease, color 0.5s ease;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    padding:20px;
  }

  /* fiery wallpaper overlay (hidden by default) */
  .fire-overlay{
    pointer-events:none;
    position:fixed;
    inset:0;
    mix-blend-mode:screen;
    opacity:0;
    transition:opacity 0.9s ease;
  }
  .fire-overlay.active{ opacity:1; }

  /* subtle animated flame shapes */
  .flame{
    position:absolute;
    width:120%;
    height:130%;
    left:-10%;
    top:-15%;
    background:
      radial-gradient(30% 20% at 10% 20%, rgba(255,200,120,0.08), transparent 20%),
      radial-gradient(40% 30% at 80% 40%, rgba(255,80,0,0.06), transparent 20%),
      linear-gradient(180deg, rgba(255,100,30,0.06), rgba(0,0,0,0) 40%);
    transform: translateY(0);
    animation: flicker 3s infinite;
    filter: blur(30px);
  }
  @keyframes flicker{
    0%{transform: translateY(0) scale(1)}
    30%{transform: translateY(-6px) scale(1.02)}
    60%{transform: translateY(3px) scale(0.99)}
    100%{transform: translateY(0) scale(1)}
  }

  /* Main card */
  .card{
    width:100%;
    max-width:460px;
    background:var(--card);
    border-radius:18px;
    padding:28px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.6);
    text-align:center;
    position:relative;
    overflow:hidden;
  }

  /* Header (shown before opening) */
  h1.header{
    font-family:'Anton',sans-serif;
    font-size:20px;
    margin:0 0 14px 0;
    color: #ffd3a6;
    letter-spacing:0.6px;
    text-shadow: 0 4px 18px rgba(255,110,40,0.14);
  }
  .sub{
    font-size:13px;
    margin-bottom:16px;
    opacity:0.9;
    color: #fff;
  }

  /* Input + button */
  .controls { display:block; }
  input.pw{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:none;
    outline:none;
    font-size:15px;
    box-sizing:border-box;
  }
  button.go{
    margin-top:12px;
    width:100%;
    padding:12px;
    border-radius:12px;
    border:none;
    cursor:pointer;
    font-weight:700;
    font-size:15px;
    background: linear-gradient(90deg,#ff6a00,#ff0033);
    color:#120607;
    box-shadow: 0 8px 30px rgba(255,60,20,0.14);
    transition: transform .18s ease;
  }
  button.go:active{ transform: scale(.998) }

  .error{ color:#ff8b8b; margin-top:10px; font-size:14px; min-height:18px }

  /* Secret area (shown after correct password) */
  #secret { display:none; margin-top:6px; }
  .secret-title{
    font-family:'Anton',sans-serif;
    font-size:22px;
    margin:6px 0 10px;
    /* red-black 2-tone effect */
    background: linear-gradient(90deg, #ff001f 0%, #120000 50%, #ff3b00 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 6px 30px rgba(255,50,10,0.18);
  }

  .pic-wrap{
    border-radius:14px;
    overflow:hidden;
    margin-top:6px;
    position:relative;
    border:6px solid rgba(0,0,0,0.45);
    box-shadow: 0 18px 60px rgba(255,60,10,0.08);
    background: linear-gradient(180deg, rgba(0,0,0,0.2), rgba(255,40,0,0.02));
  }
  img#pic{
    width:100%;
    height:auto;
    display:block;
    transform-origin:center;
    transform: scale(0.98);
    transition: transform .9s cubic-bezier(.2,.9,.2,1), filter .6s ease;
    filter: saturate(.98) contrast(.98);
  }
  /* image entrance */
  .reveal img#pic{ transform: scale(1); filter: drop-shadow(0 30px 60px rgba(255,80,20,0.12)) saturate(1.05) contrast(1.05); }

  /* body fiery theme when active */
  body.fire{
    background: radial-gradient(circle at 10% 10%, #331100 0%, #220000 15%, #0f0200 40%, #000000 100%);
    color:#ffd9c8;
  }
  body.fire .card{ background: rgba(20,4,0,0.5); box-shadow: 0 40px 80px rgba(255,70,10,0.08) }
  body.fire .header{ opacity:0; transform: translateY(-8px); }
  body.fire .secret-title{ text-shadow: 0 10px 40px rgba(255,50,10,0.6) }

  /* small responsive tweaks */
  @media (max-width:420px){
    .card{ padding:20px; border-radius:14px }
    .secret-title{ font-size:20px }
    h1.header{ font-size:18px }
  }
</style>
</head>
<body>
  <!-- fiery overlay - cosmetic only -->
  <div class="fire-overlay" id="fireOverlay" aria-hidden="true">
    <div class="flame"></div>
  </div>

  <div class="card" id="card">
    <h1 class="header" id="headerText">Password daalo dost, aapse ek baat puchni hai</h1>
    <div class="sub" id="subText">Type the password to reveal.</div>

    <div class="controls" id="controls">
      <input class="pw" id="pw" type="password" placeholder="Enter password" autocomplete="off" />
      <button class="go" id="open">Open</button>
      <div class="error" id="msg"></div>
    </div>

    <!-- secret section -->
    <div id="secret" aria-hidden="true">
      <div class="secret-title" id="secretTitle">Maa kaisi hai Teri?</div>
      <div class="pic-wrap" id="picWrap">
        <img id="pic" src="funny_face.jpg" alt="private" />
      </div>
    </div>
  </div>

<script>
  // plain password (same as before)
  const PASSWORD = 'bhootkimaakichut';

  const pw = document.getElementById('pw');
  const btn = document.getElementById('open');
  const msg = document.getElementById('msg');
  const secret = document.getElementById('secret');
  const card = document.getElementById('card');
  const fireOverlay = document.getElementById('fireOverlay');
  const picWrap = document.getElementById('picWrap');
  const secretTitle = document.getElementById('secretTitle');

  btn.addEventListener('click', tryOpen);
  pw.addEventListener('keydown', e => { if(e.key === 'Enter') tryOpen(); });

  function tryOpen(){
    msg.textContent = '';
    const val = pw.value || '';
    if(!val){
      msg.textContent = 'Password daal bhai';
      return;
    }
    if(val !== PASSWORD){
      msg.textContent = 'Wrong password';
      pw.value = '';
      // optional small shake
      card.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }], { duration: 280 });
      return;
    }

    // success: hide controls + header, show secret, activate fiery theme
    document.body.classList.add('fire');
    fireOverlay.classList.add('active');

    // hide controls cleanly
    document.getElementById('controls').style.display = 'none';
    document.getElementById('headerText').style.display = 'none';
    document.getElementById('subText').style.display = 'none';

    // reveal secret and animate image
    secret.style.display = 'block';
    // add class to trigger image transform
    setTimeout(() => { card.classList.add('reveal'); document.querySelector('#pic').style.transform = 'scale(1)'; }, 40);

    // tiny glow pulse on secret title
    secretTitle.animate([{ opacity: 0.6 }, { opacity: 1 }, { opacity: 0.8 }], { duration: 1200, iterations: 2 });

    // optional: small confetti-like ember effect (CSS-free: create tiny floating dots)
    spawnEmbers();
  }

  function spawnEmbers(){
    // create some floating ember dots for a moment
    for(let i=0;i<8;i++){
      const d = document.createElement('div');
      d.style.position='fixed';
      d.style.left = (20 + Math.random()*60) + '%';
      d.style.top = (10 + Math.random()*60) + '%';
      d.style.width = d.style.height = (6 + Math.random()*10) + 'px';
      d.style.borderRadius='50%';
      d.style.background = 'radial-gradient(circle, rgba(255,210,120,1), rgba(255,60,10,0.6))';
      d.style.boxShadow = '0 6px 18px rgba(255,90,30,0.3)';
      d.style.pointerEvents='none';
      d.style.opacity=1;
      d.style.zIndex=9999;
      document.body.appendChild(d);
      const dx = (Math.random()-0.5)*200;
      const dy = - (80 + Math.random()*160);
      d.animate([
        { transform:'translate3d(0,0,0) scale(1)', opacity:1 },
        { transform:`translate3d(${dx}px,${dy}px,0) scale(.3)`, opacity:0 }
      ], {
        duration: 1800 + Math.random()*1200,
        easing: 'cubic-bezier(.2,.9,.2,1)'
      });
      setTimeout(()=> d.remove(), 3200);
    }
  }
</script>
</body>
</html>
